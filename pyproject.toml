[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-topopt"
version = "1.0.0"
description = "Nonlinear compliant inverter topology optimization with HuHu third-medium contact"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23,<2", "scipy>=1.10,<1.12"]

[project.scripts]
ci-topopt = "ci_topopt.__main__:main"

[tool.setuptools.packages.find]
include = ["ci_topopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
