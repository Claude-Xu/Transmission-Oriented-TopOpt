name: checks
on: [push, pull_request]
jobs:
  nonlinear:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash -el {0}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: ci-topopt
          use-mamba: true
          channel-priority: strict
      - run: python -m pytest -q
      - run: mpiexec -n 2 python -m pytest -q
      - run: python -m ci_topopt --config configs/smoke.json
      - run: mpiexec -n 2 python -m ci_topopt --config configs/smoke.json --output results/smoke-mpi
